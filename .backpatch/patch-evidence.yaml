schema: osera-patch-evidence/0.1.0
producer: moderne
release: 11.3.3-backpatch-00002
baseline: v11.3.2+backpatch.baseline
fixes:
  - cve: CVE-2026-118257
    upstream_fix_url: https://github.com/intlify/vue-i18n/commit/43391d20e7c85403cb59bdb21b5d542819f54042
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-118257
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-vue-i18n/commit/86b6587
    basis: backport
    artifacts:
      - vue-i18n
      - petite-vue-i18n
      - "@intlify/core"
      - "@intlify/vue-i18n-core"
      - "@intlify/core-base"
      - "@intlify/shared"
    note: "Carried from 11.3.3-backpatch-00001; upstream's fix in 11.4.14, placed by hand in packages/shared/src/utils.ts. sanitizeTranslatedHtml writes a srcdoc attribute's name as &#115;rcdoc, so the element keeps no srcdoc attribute, whatever its case, quoting or boundary. @intlify/shared ships rebuilt at this counter so that it keeps the fix. Bypasses of the same sanitizer that upstream closed later stay open: javascript: URLs, which 11.3.2 writes as javascript&#58; and an HTML parser decodes back (upstream's 4941b9a0, 11.4.4), and the vectors of GHSA-473g-cvf6-mfxj and GHSA-jrxq-gc2q-9357."
  - cve: CVE-2026-118256
    upstream_fix_url: https://github.com/intlify/vue-i18n/commit/d657ce8f4b3b6b198a8f6e3d09e2b57a5d019fb8
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-118256
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-vue-i18n/commit/8c9da8d
    basis: backport
    artifacts:
      - vue-i18n
      - petite-vue-i18n
      - "@intlify/core"
      - "@intlify/vue-i18n-core"
      - "@intlify/core-base"
    note: "New in this release; upstream's fix in 11.4.14, applied as is. With escapeParameter on, translate now escapes the named values when the same call also passes a list, where 11.3.2 escaped only the list, and it escapes a copy, so the caller's named object keeps its values. @intlify/core-base carries the change; @intlify/core, @intlify/vue-i18n-core, vue-i18n and petite-vue-i18n inline it in their browser bundles and are rebuilt."
tests:
  commit: 8c9da8d1a5a838adb6a79db23712afe538cdb080
  command: pnpm@9.0.4 install --frozen-lockfile --ignore-scripts at the tag, then at the tested commit pnpm build:type and TZ=UTC vitest run -c vitest.unit.config.ts --typecheck with vitest's junit reporter; the shipped files ran upstream's sanitizer and escapeParameter tests under node --test with its junit reporter; hostname attributes removed from the reports
  runtime: Node.js v22.16.0, pnpm 9.0.4, macOS 27.2 arm64
  report: shared-11.3.3-backpatch-00002-tests.zip
  report_sha256: a879baf5fac419c98e57a6c9f359e71c25c46c826b1268b5422f0c1bc32f2370
  result: pass
  note: "Upstream's unit suite at the tested commit: 907 tests, 872 passed, 2 skipped and 33 todo, as 11.3.2 skips and marks them. On 11.3.3-backpatch-00001's code, both tests upstream's fix adds fail: escape both list and named values, and keep the named values of the caller as they are. The sanitizeTranslatedHtml describe and translate.test.ts's srcdoc test and the fix's two tests ran on the packaged files of the six rebuilt members, through each entry point, with NODE_ENV development and production: 88 entries, 603 passed, 0 failed, 4 skipped; @intlify/vue-i18n-core's 4 self-contained browser bundles export no way to register a message resolver, so no public call reaches them. On 11.3.3-backpatch-00001's files the fix's two tests fail on all 75 entries that translate; on npmjs's 11.3.2 files the srcdoc tests fail too. Built with pnpm 9.0.4 at the tag, every file of the eight members' 11.3.2 tarballs matches npmjs's byte for byte except the order of dependencies in 4 package.json files; each released package.json is npmjs's with version and member references moved. Upstream's e2e suite on the installed Chrome, headless: 147 passed, and the same 2 datetime-format rendering tests fail on 11.3.2 and on this release. The archive's file-origins.yaml maps each packaged file of the six rebuilt members to the commit, or names its inputs and build."
